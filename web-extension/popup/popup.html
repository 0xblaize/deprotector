<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Deprotector Security Status</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <div class="logo">
      <!-- Shield Icon SVG -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
      <span>Deprotector Engine</span>
    </div>
    <span class="badge active">ACTIVE</span>
  </div>

  <div class="status-box">
    <div class="status-indicator">
      <span class="pulse"></span>
      <span class="status-text">Shield Protection Live</span>
    </div>
    <p class="description">Monitoring mempool streams on Ethereum, Base, & Robinhood Chain.</p>
  </div>

  <div class="stats">
    <div class="stat-card">
      <div class="stat-value" id="blocked-count">0</div>
      <div class="stat-label">Blocked Phishing Sites</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="active-chain">EVM + L2</div>
      <div class="stat-label">Guarded Networks</div>
    </div>
  </div>

  <div class="footer">
    <span>Counter-Drainer Protocol v1.0</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
