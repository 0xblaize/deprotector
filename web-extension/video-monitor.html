<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Video Monitor & Color Grade Feed</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at center, rgba(15, 23, 42, 0.86) 42%, #000000 66%);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 24px;
      min-height: 100vh;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 16px;
    }
    .header svg {
      width: 24px;
      height: 24px;
      stroke: #38bdf8;
    }
    h1 { font-size: 20px; font-weight: 700; color: #f8fafc; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
    }
    .video-container {
      background: #1e293b;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #334155;
      filter: url(#grade);
      position: relative;
    }
    .video-container.darker-lift {
      filter: url(#grade2);
    }
    .video-container video {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
    }
    .label {
      position: absolute;
      bottom: 12px;
      left: 12px;
      background: rgba(15, 23, 42, 0.8);
      color: #38bdf8;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid #334155;
    }
  </style>
</head>
<body>

  <div class="header">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
      <circle cx="12" cy="13" r="4"/>
    </svg>
    <h1>Synced Security Stream Feeds</h1>
  </div>

  <div class="grid">
    <div class="video-container">
      <video autoplay loop muted playsinline src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"></video>
      <div class="label">Master Stream (#grade)</div>
    </div>
    <div class="video-container">
      <video autoplay loop muted playsinline src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"></video>
      <div class="label">Follower Stream 1</div>
    </div>
    <div class="video-container darker-lift">
      <video autoplay loop muted playsinline src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"></video>
      <div class="label">Follower Stream 2 (#grade2)</div>
    </div>
  </div>

  <script src="videoSync.js"></script>
</body>
</html>
