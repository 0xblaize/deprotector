<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Deprotector Security Settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
        <span>Deprotector Shield Configuration</span>
      </div>
    </div>

    <div class="section">
      <h2>Backend Engine API Connection</h2>
      <div class="form-group">
        <label for="apiUrl">Backend base URL</label>
        <input type="url" id="apiUrl" value="http://localhost:4000" placeholder="https://api.example.com">
        <small>Used for threat telemetry only. The extension never receives private keys.</small>
      </div>
    </div>

    <div class="section">
      <h2>Protection Shields</h2>
      <div class="toggle-group">
        <label>
          <input type="checkbox" id="blocklistShield" checked>
          <span>Enable Dynamic Blocklist Interception</span>
        </label>
      </div>
      <div class="toggle-group">
        <label>
          <input type="checkbox" id="heuristicShield" checked>
          <span>Enable Heuristic DOM Script Analyzer</span>
        </label>
      </div>
      <div class="toggle-group">
        <label>
          <input type="checkbox" id="l2PreemptiveShield" checked>
          <span>Enable L2 Sequencer Pre-emptive Invalidation (Base & Robinhood Chain)</span>
        </label>
      </div>
    </div>

    <button id="saveBtn">Save Settings</button>
    <div id="statusMsg" class="status-msg"></div>
  </div>

  <script src="options.js"></script>
</body>
</html>
